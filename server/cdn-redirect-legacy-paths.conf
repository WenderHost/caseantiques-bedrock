# cdn-redirect-legacy-paths.conf — caseantiques.com CDN fallback for pre-Bedrock paths
# whose DB URLs were migrated to /app/uploads/... but whose offloaded bytes still live on
# S3 under the legacy wp-content/uploads/ prefix.
#
# Companion to cdn-redirect.conf (which handles /app/uploads/YYYY/MM/ date media and the
# generic /app/uploads/ + /wp-content/uploads/ cases). Both are CUSTOM files (not
# SpinupWP-managed), so they survive provider upgrades.
#
# LOAD ORDER MATTERS: nginx matches regex locations in definition order (first match wins).
# The server/* include is loaded alphabetically, and this filename sorts BEFORE
# "cdn-redirect.conf" ('-' 0x2D < '.' 0x2E). That guarantees the specific locations below
# are evaluated before cdn-redirect.conf's catch-all `^/app/uploads/(.*)$`. Do not rename
# this file to sort after cdn-redirect.conf, or these rules will never match.
#
# Re-declared here (not relying on cdn-redirect.conf) so this file is self-contained.
set $production s3.amazonaws.com/cdn.caseantiques.com;

# --- legacy-items (lot images, e.g. lot-103 -> legacy-items/103_1.jpg) ---
# Blanket redirect: nothing legacy-items exists under app/uploads/ on S3 — every object is
# under wp-content/uploads/legacy-items/ — so no folder scoping is needed. Serve from disk
# if still present, else 302 to the legacy S3 prefix.
location @prod_legacy_items {
    rewrite "^(.*)/app/uploads/legacy-items/(.*)$" "https://$production/wp-content/uploads/legacy-items/$2" break;
}
location ~ "^/app/uploads/legacy-items/.*$" {
    try_files $uri @prod_legacy_items;
}

# --- legacy auction folders (the client's old per-auction dirs) ---
# These were offloaded under wp-content/uploads/auctions/<folder>/, but the DB now serves
# them as /app/uploads/auctions/<folder>/. The match MUST be scoped to the exact legacy
# folder names: CURRENT auctions (e.g. 2025-summer, 2026-winter) correctly live under
# app/uploads/auctions/ and must NOT be redirected. The list below is the authoritative set
# from `aws s3 ls wp-content/uploads/auctions/` and is frozen — new auctions go to
# app/uploads/auctions/, so nothing new needs adding here. Names are ordered longest-first
# so prefixes can't shadow longer siblings (e.g. 2014-04-30_copy before 2014-04-30).
location @prod_legacy_auctions {
    rewrite "^(.*)/app/uploads/auctions/(.*)$" "https://$production/wp-content/uploads/auctions/$2" break;
}
location ~ "^/app/uploads/auctions/(winter_2024_auction|oct_16th_auction|oct_1_2011|may_21_2011|May_18_2013_FINAL|June_30_2012|jan_28_2012_auction|jan_22_2011_preview|jan_22_2011_final_cat|2025_winter|2024_summer|2023-09-05|2023-05-23|2023-01-28|2022-10-08|2022-07-10|2022-01-29|2021-10-23|2021-07-24|2021-01-30|2020-07-11|2020-01-25|2019-10-05|2019-07-13|2019-04-27|2019-01-26|2018-10-06|2018-07-14|2018-01-27|2017-10-21|2017-08-05-final|2017-08-05|2017-04-22|2017-01-21|2016-10-22|2016-07-30|2016-04-48|2016-01-23|2015-04-15|2015-01-24|2015_10_29|2015_07_18|2014-09-25|2014-07-19|2014-04-30_copy|2014-04-30|2014_01_25|2013-09-27_auction|2013-02-12_igavel|2013-01-26|2012-10-06_preview|2012-10-06_auction)/.*$" {
    try_files $uri @prod_legacy_auctions;
}

