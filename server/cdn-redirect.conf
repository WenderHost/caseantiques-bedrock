    set $production s3.amazonaws.com/cdn.caseantiques.com;

    # http://caseantiques.com/app/uploads/auctions/2019-07-13/699_1-800x277.jpg

    # Redirect requests to /wp-content/uploads/* to production server
    # (legacy pre-Bedrock URLs; the bucket still holds these under the wp-content/uploads/ prefix)
    location @prod_uploads {
        rewrite "^(.*)/wp-content/uploads/(.*)$" "https://$production/wp-content/uploads/$2" break;
    }

    # Rule for handling requests to https://caseantiques.com/wp-content/uploads/
    # Stopgap: many pre-Bedrock URLs are hardcoded in content but the file now lives
    # on disk under app/uploads/ (migration moved it, not yet offloaded). Try that local
    # path before falling back to the S3 wp-content/uploads/ prefix for offloaded files.
    location ~ "^/wp-content/uploads/(.*)$" {
        try_files $uri /app/uploads/$1 @prod_uploads;
    }

    # Redirect requests to /app/uploads/* to production server
    location @prod_bedrock_uploads {
        rewrite "^(.*)/app/uploads/(.*)$" "https://$production/app/uploads/$2" break;
    }

    # Rule for handling requests to https://caseantiques.com/app/uploads/
    location ~ "^/app/uploads/(.*)$" {
        try_files $uri @prod_bedrock_uploads;
    }    
