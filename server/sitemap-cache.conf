# Custom (Wenmark Digital) — NOT managed by SpinupWP.
#
# Re-enable FastCGI caching for the XML sitemaps.
#
# SpinupWP's managed server/fastcgi-cache.conf lists `sitemap(_index)?.xml` in its
# "don't cache" block, so by default every sitemap hit bypasses the cache and is
# regenerated by PHP. AIOSEO's sitemaps are very expensive to build (the /sitemap.xml
# index ~48s, cold sub-sitemaps ~25s), and crawlers hammer them every morning
# ~07:00 ET — that uncached, DB-heavy load exhausted the PHP-FPM pool and took the
# site down daily (see bin/logs/ analysis, June 2026).
#
# This file lives in the `server/*` include set, which nginx loads alphabetically,
# so it runs AFTER fastcgi-cache.conf and overrides its decision: we clear the skip
# flag for sitemap URLs only, letting them be served from cache (a once-per-TTL
# rebuild instead of once-per-request). The SpinupWP-managed file is left untouched
# so it survives provider updates; this override survives them too.
#
# Cache-stampede protection for the slow rebuild lives in
# location/cache-stampede-protection.conf.
if ($request_uri ~* "sitemap(_index)?\.xml") {
	set $skip_cache 0;
}
