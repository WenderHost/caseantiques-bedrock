# Custom (Wenmark Digital) — NOT managed by SpinupWP.
#
# URLs that can never resolve are answered here with 410, before the FastCGI
# handoff, so WordPress is never bootstrapped for them.

# Kill malformed [[CDATA[...]] Requests
location ~* "\[CDATA\[" { return 410; }

# Kill dead attachment sitemaps.
# Attachments were removed from the AIOSEO sitemap in June 2026, so
# /attachment-sitemap.xml and /attachment-sitemapNNN.xml no longer exist and are
# not in the sitemap index. Meta's crawler (meta-webindexer) still has hundreds
# queued and re-requests them every morning; each one cost a full, uncacheable
# WordPress bootstrap (~0.7s of PHP) just to return a 404. On 2026-10-01 they
# were 681 requests, 82% of the day's 404s and ~60% of PHP renders at the peak.
location ~* ^/attachment-sitemap[0-9]*\.xml$ { return 410; }

# Kill dead item tag sitemaps
# 10/01/2026 (11:10) - MWENDER turned off this type of sitemap in the
# settings for the AIOSEO plugin.
location ~* ^/item_tags-sitemap[0-9]*\.xml$ { return 410; }
