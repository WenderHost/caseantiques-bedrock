# Custom (Wenmark Digital) — NOT managed by SpinupWP.
#
# Cache-stampede protection — critical for the slow-to-generate XML sitemaps that
# server/sitemap-cache.conf re-enables caching for.
#
# fastcgi_cache_lock: when a cache key is being populated, only ONE request goes
#   to PHP to build it; concurrent requests for the same URL wait for that result
#   instead of all stampeding the backend (the 07:00 crawler thundering herd).
# fastcgi_cache_lock_timeout: how long a waiting request will wait before it gives
#   up and goes to PHP itself — set high enough to cover the ~48s sitemap rebuild.
# fastcgi_cache_lock_age: how long the lock-holder may take to populate the cache
#   before nginx lets one more request through to retry. Defaults to 5s, which would
#   leak an extra builder every ~5s during the ~48s sitemap rebuild; raised to 60s so
#   a single request owns the rebuild. Only exercised when a render genuinely stalls,
#   so it's a no-op for fast normal pages.
# fastcgi_cache_background_update: serve the existing (stale) copy immediately while
#   the refresh runs in the background, so no client ever blocks on the slow rebuild.
#   (SpinupWP's managed server/fastcgi-cache.conf already lists `updating` in
#   fastcgi_cache_use_stale, which this relies on.)
#
# Kept in a separate file (not SpinupWP's managed location/fastcgi-cache.conf) so it
# survives provider updates to that file.
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 60s;
fastcgi_cache_lock_age 60s;
fastcgi_cache_background_update on;
